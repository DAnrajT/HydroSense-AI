services:
  - type: worker
    name: HydroSense-ai-detector
    runtime: python
    buildCommand: pip install -r requirements.txt && python train_model.py --synthetic 5000
    startCommand: python live_detector.py
    envVars:
      - key: FIREBASE_DATABASE_URL
        value: https://water-leak-detection-5228d-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_EMAIL
        sync: false
      - key: FIREBASE_PASSWORD
        sync: false
